version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm-workspace.yaml `minimumReleaseAge: 1440` (24 h).
    cooldown:
      default-days: 1
    # The PR title check needs a Conventional Commit title; build(deps) does not release.
    commit-message:
      prefix: build
      include: scope
    ignore:
      # vite-plus and the `vite` override in pnpm-workspace.yaml (vite-plus-core)
      # must move together, and Dependabot can't edit the override. Bump both by
      # hand, then run pnpm install.
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/vite-plus-core"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
