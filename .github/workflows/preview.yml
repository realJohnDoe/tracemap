name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: write
  pull-requests: write

# Own group per PR, so it never cancels or is cancelled by a production deploy.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Adding any other label (e.g. automerge) must not rebuild.
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      # The build uses a relative base, so it works from any subfolder.
      - run: pnpm run build
        if: github.event.action != 'closed'
      # Forks can't push to gh-pages; only PRs labelled `preview` deploy.
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'preview')
        with:
          source-dir: apps/web/dist
