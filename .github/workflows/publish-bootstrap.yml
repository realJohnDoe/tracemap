# One-off first publish with a token, needed because npm trusted publishing can only be set up
# for a package that already exists. Delete this workflow and the NPM_TOKEN secret afterwards.
name: Publish to npm (first release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test -w @realjohndoe/tracemap
      - run: npm run build -w @realjohndoe/tracemap
      - run: npm publish -w @realjohndoe/tracemap --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
